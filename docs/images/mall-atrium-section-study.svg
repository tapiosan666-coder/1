<text x="45" y="837" font-family="Noto Sans CJK JP,sans-serif" font-size="20" fill="#243746">床スラブ0.35m・手すり1.2mは仮設定。柱・梁・防火区画・設備・避難経路は次の詳細設計で検討。</text>
<text x="45" y="877" font-family="Noto Sans CJK JP,sans-serif" font-size="20" fill="#243746">エスカレーターは図の奥のコアに配置する案。斜路の乗降口と猫の経路を一緒に設計します。</text>
<text x="45" y="918" font-family="Noto Sans CJK JP,sans-serif" font-size="20" fill="#243746">地下・屋上の用途は別途設計。この断面は商業3層の見え方を確認するための図です。</text>
<text x="45" y="956" font-family="Noto Sans CJK JP,sans-serif" font-size="18" fill="#243746">水平と鉛直の表示縮尺は異なります。寸法値を参照してください。</text>

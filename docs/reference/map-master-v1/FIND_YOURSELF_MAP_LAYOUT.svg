 <path d="M1180 250 L1460 475 L1178 520 Z" fill="#e2ecdf" stroke="#7e9d78" stroke-width="4"/>
 <path d="M1226 296 L1390 461 L1214 482 Z" class="walk" style="stroke-width:27"/>
 <circle cx="1285" cy="421" r="37" class="atrium"/><text x="1284" y="310" class="head">Building A</text><text x="1292" y="336" class="small">Triangular loop</text>
 <!-- building C -->
 <path d="M780 180 Q885 132 975 217 Q1037 260 1004 335 Q951 375 896 338 Q836 355 788 303 Q738 249 780 180Z" fill="#ebeadc" stroke="#b6aa80" stroke-width="4"/>
 <path d="M807 219 Q880 174 951 244 Q965 279 940 309 Q868 324 808 272" class="walk"/>
 <ellipse cx="889" cy="256" rx="45" ry="38" class="atrium"/>
 <text x="846" y="170" class="head">Building C</text><text x="807" y="189" class="small">Outdoor outlet</text>
 <!-- bridges -->
 <path d="M652 406 L1172 405" class="bridge"/><path d="M638 348 Q726 307 777 293" class="bridge"/>
 <rect x="811" y="391" width="177" height="26" rx="6" fill="#fff"/><text x="820" y="409" class="small">A/B 2F bridge</text>
 <rect x="666" y="270" width="150" height="28" rx="6" fill="#fff"/><text x="671" y="289" class="small">B/C 2F bridge</text>
 <text x="87" y="555" class="tiny">Diagrammatic position only. Resolve exact coordinates and bridge endpoints against the existing game.</text>
 <!-- lower B floor diagram -->
 <rect x="32" y="610" width="1536" height="396" rx="16" fill="#fff" stroke="#d0d9d7"/>
 <text x="55" y="652" class="head">02 — Building B: common 1F / 2F / 3F void locations</text>
 <text x="55" y="676" class="sub">Game target envelope ~500×160m. Align atrium voids precisely on every floor.</text>
 <!-- store rows and concourses -->
 <g>
  <rect x="70" y="711" width="1415" height="54" rx="5" class="store"/>
  <rect x="70" y="889" width="1415" height="54" rx="5" class="store"/>

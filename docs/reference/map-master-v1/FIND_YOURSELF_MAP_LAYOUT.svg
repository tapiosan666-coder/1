<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
 <rect width="1600" height="1050" fill="#f6f7f4"/>
 <style>text{font-family:'Noto Sans CJK JP','Yu Gothic',sans-serif;fill:#152d37}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#56717a}.head{font-size:24px;font-weight:700}.small{font-size:15px}.tiny{font-size:13px}.store{fill:#abcbdc;stroke:#467e99;stroke-width:2}.walk{fill:none;stroke:#b4d7b9;stroke-width:24;stroke-linejoin:round;stroke-linecap:round}.atrium{fill:#fbe3a6;stroke:#bc9853;stroke-width:3}.es{fill:#de7655;stroke:#a34b31;stroke-width:2}.bridge{fill:none;stroke:#3d6481;stroke-width:17;stroke-linecap:round}</style>
 <text x="50" y="60" class="title">FIND YOURSELF | Mall Master Layout</text>
 <text x="50" y="90" class="sub">Concept geometry — game-design dimensions, NOT measured floor plan of AEON LakeTown</text>
 <rect x="32" y="120" width="1536" height="470" rx="16" fill="#fff" stroke="#d0d9d7"/>
 <text x="54" y="160" class="head">01 — Three-building connection diagram</text>
 <!-- building B -->
 <path d="M90 325 Q250 250 420 305 L670 350 Q690 430 620 488 Q400 550 145 470 Z" fill="#e1e9ed" stroke="#7392a0" stroke-width="4"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -2.5 6 5"><style>text{font-family:Arial,sans-serif;fill:#173540}</style><rect x="-1000" y="-1000" width="2000" height="2000" fill="#f2f1e7"/><text x="-3" y="-2" font-size=".2">B-WEST twin flight: closed 4.070m underside</text><rect x="-2.035" y=".1" width="4.07" height=".846" fill="#9caa98"/><rect x="-1.75" y="-.1" width="1.3" height=".2" fill="#364c53"/><rect x=".45" y="-.1" width="1.3" height=".2" fill="#364c53"/><path d="M-2.035,.946H2.035" stroke="#40594b" stroke-width=".035"/><text x="-2.9" y="1.5" font-size=".15">No open centre slot. 4mm cassette joints have a continuous closed backpan.</text><text x="-2.9" y="1.8" font-size=".15">Original two ramps + tread/belt controllers retained; no duplicate ramp collision.</text></svg>